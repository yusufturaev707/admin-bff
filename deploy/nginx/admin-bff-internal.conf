# /etc/nginx/sites-available/admin-bff-internal.conf  - faqat shu server ichidan
#
# Ichki tizimlar BFF'ning JWKS'ini (4-bosqich), Prometheus esa /metrics'ni
# (9-bosqich) shu yerdan oladi. Faqat 127.0.0.1'da tinglaydi, UFW tashqariga
# ochmaydi. Boshqa barcha yo'llar 404.
# `upstream admin_bff` admin-api.conf'da e'lon qilingan.

server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /internal/jwks.json {
        proxy_pass http://admin_bff;
    }

    location = /metrics {
        proxy_pass http://admin_bff;
    }

    location / {
        return 404;
    }
}
