# /etc/nginx/sites-available/admin-api.conf  - BFF'ning yagona nginx fayli
#
# Bitta faylda uch qism:
#   1. API: https://kpi.uzbmb.uz (80 HTTPS'ga yo'naltiradi). Egasining qarori,
#      2026-11-24.
#   2. Ichki: http://127.0.0.1:18081, JWKS va /metrics, faqat server ichidan.
#   3. API hujjatlari, faqat o'qish uchun: http://<server_IP>:8090/api/v1/docs.
#      Frontend ishga tushgach, bu qism o'chiriladi.
# Frontend sayti alohida fayl: admin-frontend.conf (domeni hali yo'q).
#
# API faqat `server_name`dagi nom bilan kelgan so'rovlarga javob beradi. Domen
# o'zgarsa, `# DOMEN` bilan belgilangan ikkala server_name almashtiriladi.
# Sertifikat: serverdagi *.uzbmb.uz, /etc/nginx/tls/admin-api/ ichiga symlink.
#
# default_server yo'q. Serverdagi boshqa saytlarda ham yo'q bo'lsa, nginx
# sites-enabled'da alifbo bo'yicha birinchi turgan saytni default qiladi: IP
# orqali yoki noma'lum nom bilan kelgan so'rovlar unga tushadi. Shuning uchun
# sites-enabled'dagi nom tekshiruvdan keyin tanlanadi (docs/deploy.md, 10).
# Ubuntu 22.04 (nginx 1.18) uchun yozilgan.
#
# HTTP/2: nginx 1.25.1 dan eski versiyalarda `listen ... http2` butun ip:port
# uchun ishlaydi, ya'ni bitta saytda yozilsa, shu ip:port'dagi hamma saytlar
# HTTP/2 oladi. Serverda 0.0.0.0:443'da uni boshqa sayt (api-iiv.uzbmb.uz)
# allaqachon yoqqan, shuning uchun bu yerdagi `http2` boshqa saytlar uchun
# hech narsani o'zgartirmaydi. SSE (8-bosqich) uchun HTTP/2 kerak: HTTP/1.1'da
# brauzer bitta domenga 6 tadan ortiq ulanish ochmaydi. nginx 1.25.1+ da
# `listen`dagi `http2` o'rniga server blokida `http2 on;` yoziladi.
#
# IPv6 (`listen [::]:...`) yo'q: serverdagi boshqa saytlar faqat IPv4'da
# tinglaydi. IPv6'da faqat BFF bloklari tinglasa, IPv6 orqali kelgan boshqa
# saytlarning so'rovlari ham BFF'ga tushadi.

# ===== 1. API ===================================================================

# http kontekstida: login va boshqa auth endpoint'lari uchun IP bo'yicha limit.
# Ilovaning o'zida ham username/IP bo'yicha bloklash bor (6-bo'lim).
limit_req_zone $binary_remote_addr zone=admin_bff_auth:10m rate=30r/m;

upstream admin_bff {
    server unix:/run/admin-bff/bff.sock fail_timeout=0;
    keepalive 16;
}

# 80 faqat HTTPS'ga yo'naltiradi. Allowlist bu yerda yo'q: `return` nginx'da
# allow/deny'dan oldin bajariladi, ya'ni u baribir ishlamasdi. Himoya 443'da.
server {
    listen 80;
    server_name kpi.uzbmb.uz;    # DOMEN
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kpi.uzbmb.uz;    # DOMEN

    include /etc/nginx/snippets/admin-allowlist.conf;

    # Domen sertifikati yoki serverdagi *.uzbmb.uz sertifikatiga symlink.
    ssl_certificate     /etc/nginx/tls/admin-api/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/admin-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AdminApiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    # Security header'lar. Diqqat: location ichida add_header yozilsa, bu
    # yerdagilar o'sha location'ga meros bo'lmaydi, shuning uchun location'larda
    # add_header ishlatilmaydi (yagona istisno /api/v1/docs, pastda).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    # ModSecurity + OWASP CRS: avval DetectionOnly rejimida (main.conf ichida
    # SecRuleEngine DetectionOnly). Modul o'rnatilgandan keyin yoqiladi.
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsec/main.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Ustiga yoziladi (qo'shilmaydi): mijoz X-Forwarded-For'ni soxtalashtira olmaydi.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Nginx'ning o'zi qaytaradigan xatolar ham BFF'dagi yagona formatda bo'lsin
    # (403: allowlist, 404: yopiq manzillar). BFF'ning o'z javoblariga bu
    # tegmaydi: proxy_intercept_errors o'chiq.
    error_page 403 = @forbidden;
    error_page 404 = @not_found;
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    # Ichki manzillar tashqaridan yopiq (5-, 8- va 11-bo'limlar).
    location /internal/ { return 404; }
    location = /metrics { return 404; }

    location /api/v1/auth/ {
        limit_req zone=admin_bff_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://admin_bff;
    }

    # SSE oqimi (10.1-bo'lim).
    location = /api/v1/events/stream {
        proxy_pass http://admin_bff;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Swagger UI (frontend dasturchi uchun, faqat admin:api:docs bilan). Sahifa
    # skript va stillarni shu domendan yuklaydi, shuning uchun CSP boshqacha.
    # add_header bu yerda yozilgani uchun server darajasidagilar meros bo'lmaydi:
    # kerakli header'lar shu yerda qaytadan sanab o'tilgan.
    location /api/v1/docs {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://admin_bff;
    }

    location / {
        proxy_pass http://admin_bff;
    }

    # `allow all`: javobning o'zi ham allowlist'dan o'tadi, aks holda rad
    # etilgan IP JSON o'rniga nginx'ning HTML sahifasini olardi.
    location @forbidden {
        allow all;
        default_type application/json;
        return 403 "{\"error\":{\"code\":\"forbidden\",\"message\":\"Bu amal uchun ruxsat yo'q\",\"request_id\":null,\"details\":{}}}";
    }

    location @not_found {
        allow all;
        default_type application/json;
        return 404 "{\"error\":{\"code\":\"not_found\",\"message\":\"Ma'lumot topilmadi\",\"request_id\":null,\"details\":{}}}";
    }

    location @too_large {
        default_type application/json;
        return 413 "{\"error\":{\"code\":\"validation_error\",\"message\":\"So'rov hajmi juda katta\",\"request_id\":null,\"details\":{}}}";
    }

    location @rate_limited {
        default_type application/json;
        return 429 "{\"error\":{\"code\":\"rate_limited\",\"message\":\"So'rovlar soni chegaradan oshdi, birozdan keyin urinib ko'ring\",\"request_id\":null,\"details\":{}}}";
    }

    location @unavailable {
        default_type application/json;
        return 503 "{\"error\":{\"code\":\"system_unavailable\",\"message\":\"Tizim vaqtincha ishlamayapti\",\"request_id\":null,\"details\":{}}}";
    }
}

# ===== 2. Ichki: JWKS (4-bosqich) va /metrics (9-bosqich) =======================
# Ichki tizimlar BFF'ning JWKS'ini, Prometheus esa /metrics'ni shu yerdan oladi.
# Faqat 127.0.0.1'da tinglaydi, tashqaridan ochilmaydi. Boshqa yo'llar 404.
# Port 18081: 8081 serverda band.

server {
    listen 127.0.0.1:18081;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /internal/jwks.json {
        proxy_pass http://admin_bff;
    }

    location = /metrics {
        proxy_pass http://admin_bff;
    }

    location / {
        return 404;
    }
}

# ===== 3. API hujjatlari (faqat o'qish), frontend ishga tushguncha =============
# http://<server_IP>:8090/api/v1/docs va /api/v1/openapi.json: yo'llar API'ning
# o'zidagidek. Production'dagi haqiqiy /api/v1/docs frontend orqali kirilgan
# sessiyani talab qiladi, frontend esa hali yo'q. nginx repo'dagi sxemani
# (openapi/v1.json) va lokal Swagger UI fayllarini beradi, BFF'ga so'rov
# ketmaydi, "Try it out" o'chiq. Sxema `admin-bff update` bilan yangilanadi.
# Port 8090: serverdagi boshqa saytlar 80, 443, 8080, 8020 va 8081'da.

server {
    listen 8090;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/admin-allowlist.conf;

    # openapi/ papkasidan faqat pastdagi uchta fayl beriladi.
    root /srv/admin-bff/openapi;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = / {
        return 302 /api/v1/docs;
    }

    location = /api/v1/docs {
        default_type text/html;
        try_files /index.html =404;
    }

    location = /api/v1/docs/viewer.js {
        try_files /viewer.js =404;
    }

    location = /api/v1/openapi.json {
        try_files /v1.json =404;
    }

    location /api/v1/docs/static/ {
        alias /srv/admin-bff/app/static/swagger-ui/;
    }

    location / {
        return 404;
    }
}
