# /etc/nginx/sites-available/admin-bff-docs.conf  - API hujjatlari frontendchi uchun
#
# Domen va HTTPS bo'lmaganda ham ishlaydi: http://<server_IP>:8090/
# Faqat o'qish uchun Swagger UI: repo'dagi OpenAPI sxemasi (openapi/v1.json) va
# lokal Swagger UI fayllari. BFF'ga so'rov ketmaydi, "Try it out" o'chiq:
# haqiqiy API HTTPS va sessiya cookie'sini talab qiladi. Sxema
# `admin-bff update` (git pull) bilan o'zi yangilanadi.
#
# sites-enabled'ga `zz-admin-bff-docs.conf` nomi bilan ulanadi (docs/deploy.md).
# Port 8090: serverdagi boshqa saytlar 80, 443, 8080, 8020 va 8081'da.

server {
    listen 8090;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/admin-allowlist.conf;

    root /srv/admin-bff/openapi;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    # openapi/ papkasidan faqat shu uchta fayl beriladi.
    location = /index.html {}
    location = /viewer.js {}
    location = /v1.json {}

    location /swagger-ui/ {
        alias /srv/admin-bff/app/static/swagger-ui/;
    }

    location / {
        return 404;
    }
}
