# /etc/nginx/sites-available/admin-bff-test.conf  - domen olinguncha frontendchi uchun API
#
# https://<server_IP>:8443/  : API va Swagger UI (/api/v1/docs), so'rov yuborsa bo'ladi.
# Vaqtinchalik (egasining qarori, 2026-11-24): domen olingach, bu sayt
# o'chiriladi va admin-api.conf ulanadi (docs/deploy.md).
#
# - HTTPS shart: login cookie'si Secure, brauzer uni http orqali saqlamaydi.
#   Domen yo'q, shuning uchun sertifikat IP uchun o'zimiz yaratgan (self-signed),
#   brauzer bir marta ogohlantiradi. HSTS yo'q.
# - Servisda DOCS_TRY_IT_OUT=true bo'lishi kerak (/etc/admin-bff/admin-bff.env):
#   Swagger UI login qiladi va so'rov yuboradi.
# - Host port bilan uzatiladi: BFF Swagger'ning Origin'ini (https://<IP>:8443)
#   o'zining origin'i bilan solishtiradi.
# - upstream va zona nomlari admin-api.conf'dagidan boshqa: keyin ikkalasi bir
#   vaqtda yoqilsa ham `nginx -t` o'tadi.
# sites-enabled'ga `zz-admin-bff-test.conf` nomi bilan ulanadi.

limit_req_zone $binary_remote_addr zone=admin_bff_test_auth:10m rate=30r/m;

upstream admin_bff_test {
    server unix:/run/admin-bff/bff.sock fail_timeout=0;
    keepalive 8;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/admin-allowlist.conf;

    ssl_certificate     /etc/nginx/tls/admin-bff-test/cert.pem;
    ssl_certificate_key /etc/nginx/tls/admin-bff-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AdminBffTestTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;

    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    location /internal/ { return 404; }
    location = /metrics { return 404; }

    location /api/v1/auth/ {
        limit_req zone=admin_bff_test_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://admin_bff_test;
    }

    # Swagger UI: skript va stillar shu domendan, CSP boshqacha (admin-api.conf'dagidek).
    location /api/v1/docs {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://admin_bff_test;
    }

    location = / {
        return 302 /api/v1/docs;
    }

    location / {
        proxy_pass http://admin_bff_test;
    }

    location @too_large {
        default_type application/json;
        return 413 "{\"error\":{\"code\":\"validation_error\",\"message\":\"So'rov hajmi juda katta\",\"request_id\":null,\"details\":{}}}";
    }

    location @rate_limited {
        default_type application/json;
        return 429 "{\"error\":{\"code\":\"rate_limited\",\"message\":\"So'rovlar soni chegaradan oshdi, birozdan keyin urinib ko'ring\",\"request_id\":null,\"details\":{}}}";
    }

    location @unavailable {
        default_type application/json;
        return 503 "{\"error\":{\"code\":\"system_unavailable\",\"message\":\"Tizim vaqtincha ishlamayapti\",\"request_id\":null,\"details\":{}}}";
    }
}
