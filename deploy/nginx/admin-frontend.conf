# /etc/nginx/sites-available/admin-frontend.conf  - adminka frontendi
#
# TODO(owner): frontend domeni hali yo'q (2026-11-24), `admin.uzbmb.uz` namuna.
# U API (kpi.uzbmb.uz) bilan bitta asosiy domen ostida bo'ladi: *.uzbmb.uz,
# shunda ular same-site va SameSite=Strict cookie ishlaydi (10-bo'lim).
# Domen va build tayyor bo'lganda ulanadi (docs/deploy.md, 10).
#
# API kabi tashqi proxy orqali ishlaydi: TLS proxy'da, bu yerda 8080-port va
# oddiy HTTP (admin-api.conf boshidagi izoh). `$admin_bff_via_proxy` admin-api.conf'da
# e'lon qilingan, shuning uchun bu fayl faqat u bilan birga yoqiladi.
# O'zgartiriladigan joylar: `# DOMEN` (u /etc/admin-bff/admin-bff.env'dagi
# FRONTEND_ORIGIN bilan bir xil bo'ladi), `# PROXY` va CSP'dagi API domeni.
# Build papkasi: /var/www/admin-frontend.

server {
    listen 8080;
    server_name admin.uzbmb.uz;    # DOMEN
    server_tokens off;

    # Mijozning haqiqiy IP'si, faqat proxy'dan kelgan so'rovda (admin-api.conf).
    set_real_ip_from 192.168.200.234;    # PROXY
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($admin_bff_via_proxy = 0) {
        return 403;
    }

    include /etc/nginx/snippets/admin-allowlist.conf;

    client_max_body_size 1m;

    root /var/www/admin-frontend;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Tashqi CDN yo'q (2-bo'lim): hamma narsa 'self'dan. Yuz rasmlari API'dan
    # blob sifatida olinadi. connect-src'dagi manzil: API domeni.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://kpi.uzbmb.uz; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA: noma'lum yo'llar index.html'ga.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
