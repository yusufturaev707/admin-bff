# /etc/nginx/sites-available/admin-frontend.conf  - adminka frontendi (namuna)
#
# Frontend statik fayllari. API alohida domenda, lekin bitta asosiy domen ostida
# (same-site), shuning uchun SameSite=Strict cookie ishlaydi (10-bo'lim).
# TODO(owner): aniq domen nomlari, sertifikat yo'llari va frontend build papkasi.

server {
    listen 80;
    listen [::]:80;
    server_name admin.uzbmb.uz;
    include /etc/nginx/snippets/admin-allowlist.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.uzbmb.uz;

    include /etc/nginx/snippets/admin-allowlist.conf;

    ssl_certificate     /etc/nginx/tls/admin.uzbmb.uz/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/admin.uzbmb.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AdminFrontTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    root /var/www/admin-frontend;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Tashqi CDN yo'q (2-bo'lim): hamma narsa 'self'dan. Yuz rasmlari API'dan
    # blob sifatida olinadi.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://admin-api.uzbmb.uz; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA: noma'lum yo'llar index.html'ga.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
