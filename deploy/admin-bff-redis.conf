# /etc/admin-bff/redis.conf (root:admin-bff-redis 0640) - BFF sessiya Redis'i
#
# Alohida instans (11-bo'lim). Bu yerda sessiyalar, principal keshi
# (permission'lar) va login bloklash hisoblagichlari turadi. Bu Redis'ga yoza
# olgan har kim o'ziga istalgan permission yozib qo'ya oladi. Shuning uchun u
# serverdagi boshqa loyihalarning Redis'i bilan umumiy bo'lmaydi va ularning
# Redis'iga ham tegilmaydi.
#
# TCP yopiq, faqat unix socket. Socket'ga admin-bff-redis guruhi (admin-bff
# user'i) kira oladi, parol ham talab qilinadi. Parol bu faylga o'rnatishda
# qo'shiladi (docs/deploy.md): `requirepass <credentials/redis_password>`.

port 0
unixsocket /run/admin-bff-redis/redis.sock
unixsocketperm 770

# Loglar journald'ga (stdout).
logfile ""
always-show-logo no

# Sessiyalar qayta ishga tushishdan keyin ham qolsin.
dir /var/lib/admin-bff-redis
dbfilename dump.rdb

# Xotira to'lsa, kalitlar o'chirilmaydi, yozish xato beradi: bloklash
# hisoblagichi jimgina o'chib ketsa, parol tanlashga qarshi himoya ishlamay
# qoladi. Login xato bilan tugaydi (xavfsiz tomonga).
maxmemory 256mb
maxmemory-policy noeviction
