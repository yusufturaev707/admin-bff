# CI: barcha tekshiruvlar scripts/ci.sh ichida, lokal'da ham shu skript
# ishlatiladi (ruff, mypy, pytest + OpenAPI snapshot, bandit, alembic head,
# pip-audit).
#
# Xavfsizlik:
# - GITHUB_TOKEN faqat o'qish huquqiga ega (permissions: contents: read).
# - Action'lar commit SHA bilan qotirilgan: tag boshqa commit'ga ko'chirilsa
#   ham ishlaydigan kod o'zgarmaydi. Yangilashda SHA va izohdagi versiya
#   birga almashtiriladi.
# - pull_request_target ishlatilmaydi, fork'dan kelgan PR kodi yozish
#   huquqisiz ishlaydi.
# - CI'ga secret kerak emas: testlar tasodifiy generatsiya qilingan
#   qiymatlardan foydalanadi, test DB paroli ham har safar yangidan yaratiladi.
# - Testlar uchun PostgreSQL va Redis runner'ga apt orqali o'rnatiladi
#   (Docker service container'siz, 3-bo'lim 9-qaror).

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR'dagi eski run yangi push kelganda to'xtatiladi, master'dagisi to'xtatilmaydi.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # uv.lock shu versiya bilan yaratilgan. Python versiyasi .python-version'dan olinadi.
          version: "0.13.9"

      - name: Start PostgreSQL and Redis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql redis-server
          sudo systemctl start postgresql.service redis-server.service
          DB_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DB_PASSWORD"
          cd /tmp
          # CREATEROLE: audit huquqlari testi vaqtinchalik ilova rolini yaratadi
          # (tests/test_audit_privileges.py). PostgreSQL 16'da bu rol faqat
          # o'zi yaratgan rollarni boshqara oladi.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v pw="$DB_PASSWORD" <<'SQL'
          CREATE ROLE admin_bff LOGIN CREATEDB CREATEROLE PASSWORD :'pw';
          SQL
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Run checks
        run: bash scripts/ci.sh
