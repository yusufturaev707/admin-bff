# TODO(owner): CI platformasi tasdiqlansin. Bu konfiguratsiya o'z serverimizdagi
# GitLab uchun, Docker'siz `shell` executor'li runner'da ishlaydi (3-bo'lim,
# 8- va 9-qarorlar). Runner host'ida uv, PostgreSQL va Redis o'rnatilgan bo'ladi.
# Barcha tekshiruvlar scripts/ci.sh ichida, boshqa CI'ga o'tish oson.

stages:
  - check

check:
  stage: check
  tags:
    - shell
    - debian
  script:
    - bash scripts/ci.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
